name: container

# Builds the image on a GitHub-hosted runner and publishes it to the GitHub
# Container Registry (ghcr.io), so prod can pull a ready image instead of
# building one with SWI-Prolog, Node and the Elm compiler installed.
#
# The image reference must be lowercase: ghcr rejects "ghcr.io/KoenP/...".
#
# NOTE: `latest` is published from the `container` branch while this is still
# the working branch. Once it is merged into the default branch, change
# `branches:` below to [master].

on:
  push:
    branches: [container]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/koenp/charsheet
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
